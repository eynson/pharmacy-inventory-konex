spring:
  application:
    name: pharmacy-inventory
  datasource:
    url: jdbc:h2:mem:pharmacy_db;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  servlet:
    context-path: /
  port: 8080

logging:
  level:
    root: INFO
    com.eynson.pharmacy_inventory: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
