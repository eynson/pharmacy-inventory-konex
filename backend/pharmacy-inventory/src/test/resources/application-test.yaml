spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=Oracle
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: false

logging:
  level:
    root: WARN
    com.eynson: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
